<p-toast />
<p-confirmDialog />

<div class="page-card header-card">
  <div class="page-title">
    <h1>角色 AppRole</h1>
    <span class="subtitle">使用者角色</span>
  </div>
  <div class="page-actions">
    <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="filterVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
  </div>
</div>

<div class="page-card">
  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    styleClass="p-datatable-striped p-datatable-gridlines"
    dataKey="roleId"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" style="width: 10rem">權限等級 <p-sortIcon field="permissionLevel" /></th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" style="width: 9rem">使用者數 <p-sortIcon field="userCount" /></th>
        <th style="width: 11rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td>{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td>{{ role.userCount }}</td>
        <td>
          <div class="row-actions">
            <p-button icon="pi pi-eye" severity="secondary" [text]="true" pTooltip="檢視" (onClick)="view(role)" />
            <p-button icon="pi pi-pencil" severity="info" [text]="true" pTooltip="編輯" (onClick)="edit(role)" />
            <p-button icon="pi pi-trash" severity="danger" [text]="true" pTooltip="刪除" (onClick)="confirmDelete(role)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="filter-field">
      <label for="f-keyword">關鍵字</label>
      <input id="f-keyword" type="text" pInputText [(ngModel)]="filter.keyword" placeholder="角色代碼／名稱／描述" />
    </div>

    <div class="filter-field">
      <label>權限等級範圍</label>
      <div class="range-row">
        <p-inputnumber [(ngModel)]="filter.permissionLevelFrom" placeholder="最小" [useGrouping]="false" />
        <span class="range-sep">~</span>
        <p-inputnumber [(ngModel)]="filter.permissionLevelTo" placeholder="最大" [useGrouping]="false" />
      </div>
    </div>
  </div>

  <ng-template #footer>
    <div class="filter-footer">
      <p-button label="清除" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="clearFilter()" />
      <p-button label="套用" icon="pi pi-check" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
