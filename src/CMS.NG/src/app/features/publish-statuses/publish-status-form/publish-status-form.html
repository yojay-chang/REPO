<p-toast />

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-card header-card">
    <div class="page-title">
      <h1>{{ isEdit() ? '編輯發布狀態' : '新增發布狀態' }}</h1>
    </div>
    <div class="page-actions">
      <p-button label="取消" icon="pi pi-times" severity="secondary" type="button" (onClick)="cancel()" />
      <p-button label="儲存" icon="pi pi-check" severity="success" type="submit" [loading]="saving()" />
    </div>
  </div>

  @if (loading()) {
    <div class="page-card">載入中…</div>
  } @else {
    <div class="page-card">
      <h2 class="section-title">發布狀態資料</h2>

      <div class="form-field">
        <label for="pkid">主代碼 <span class="req">*</span></label>
        <p-inputnumber
          inputId="pkid"
          formControlName="pkid"
          [min]="0"
          [max]="255"
          [useGrouping]="false"
          placeholder="0–255"
        />
        @if (form.controls.pkid.invalid && form.controls.pkid.touched) {
          <small class="error">主代碼為必填，範圍 0–255。</small>
        }
      </div>

      <div class="form-field">
        <label for="description">狀態說明 <span class="req">*</span></label>
        <input id="description" type="text" pInputText formControlName="description" maxlength="50" placeholder="請輸入狀態說明" />
        @if (form.controls.description.invalid && form.controls.description.touched) {
          <small class="error">狀態說明為必填。</small>
        }
      </div>

      <div class="form-field switch-field">
        <label for="isDraft">草稿</label>
        <p-toggleswitch inputId="isDraft" formControlName="isDraft" />
      </div>

      <div class="form-field switch-field">
        <label for="isPublished">已發布</label>
        <p-toggleswitch inputId="isPublished" formControlName="isPublished" />
      </div>

      <div class="form-field switch-field">
        <label for="isDiscontinued">已停用</label>
        <p-toggleswitch inputId="isDiscontinued" formControlName="isDiscontinued" />
      </div>
    </div>
  }
</form>
