<p-toast />
<p-confirmDialog />

<div class="page-card header-card">
  <div class="page-title">
    <h1>發布狀態 PublishStatus</h1>
    <span class="subtitle">內容發布狀態</span>
  </div>
  <div class="page-actions">
    <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="filterVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
  </div>
</div>

<div class="page-card">
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    styleClass="p-datatable-striped p-datatable-gridlines"
    dataKey="pkid"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 8rem">草稿 <p-sortIcon field="isDraft" /></th>
        <th pSortableColumn="isPublished" style="width: 8rem">已發布 <p-sortIcon field="isPublished" /></th>
        <th pSortableColumn="isDiscontinued" style="width: 8rem">已停用 <p-sortIcon field="isDiscontinued" /></th>
        <th style="width: 11rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-status>
      <tr>
        <td>{{ status.pkid }}</td>
        <td>{{ status.description }}</td>
        <td>
          @if (status.isDraft) {
            <i class="pi pi-check flag-yes"></i>
          } @else {
            <span class="flag-no">—</span>
          }
        </td>
        <td>
          @if (status.isPublished) {
            <i class="pi pi-check flag-yes"></i>
          } @else {
            <span class="flag-no">—</span>
          }
        </td>
        <td>
          @if (status.isDiscontinued) {
            <i class="pi pi-check flag-yes"></i>
          } @else {
            <span class="flag-no">—</span>
          }
        </td>
        <td>
          <div class="row-actions">
            <p-button icon="pi pi-eye" severity="secondary" [text]="true" pTooltip="檢視" (onClick)="view(status)" />
            <p-button icon="pi pi-pencil" severity="info" [text]="true" pTooltip="編輯" (onClick)="edit(status)" />
            <p-button icon="pi pi-trash" severity="danger" [text]="true" pTooltip="刪除" (onClick)="confirmDelete(status)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="filter-field">
      <label for="f-keyword">關鍵字</label>
      <input id="f-keyword" type="text" pInputText [(ngModel)]="filter.keyword" placeholder="狀態說明" />
    </div>

    <div class="filter-field">
      <label for="f-draft">草稿</label>
      <p-select
        inputId="f-draft"
        [(ngModel)]="filter.isDraft"
        [options]="triStateOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>

    <div class="filter-field">
      <label for="f-published">已發布</label>
      <p-select
        inputId="f-published"
        [(ngModel)]="filter.isPublished"
        [options]="triStateOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>

    <div class="filter-field">
      <label for="f-discontinued">已停用</label>
      <p-select
        inputId="f-discontinued"
        [(ngModel)]="filter.isDiscontinued"
        [options]="triStateOptions"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      />
    </div>
  </div>

  <ng-template #footer>
    <div class="filter-footer">
      <p-button label="清除" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="clearFilter()" />
      <p-button label="套用" icon="pi pi-check" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
