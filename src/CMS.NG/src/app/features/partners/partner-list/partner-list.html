<p-toast />
<p-confirmDialog />

<div class="page-card header-card">
  <div class="page-title">
    <h1>合作廠商 Partner</h1>
    <span class="subtitle">課程合作廠商主資料</span>
  </div>
  <div class="page-actions">
    <p-button label="搜尋條件" icon="pi pi-filter" severity="secondary" (onClick)="filterVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
  </div>
</div>

<div class="page-card">
  <p-table
    [value]="partners()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    styleClass="p-datatable-striped p-datatable-gridlines"
    dataKey="pkid"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 8rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="name">廠商名稱 <p-sortIcon field="name" /></th>
        <th pSortableColumn="appKey" style="width: 10rem">應用金鑰 <p-sortIcon field="appKey" /></th>
        <th pSortableColumn="nameOnPartnerMenu">廠商選單顯示名稱 <p-sortIcon field="nameOnPartnerMenu" /></th>
        <th pSortableColumn="displayOrder" style="width: 9rem">顯示順序 <p-sortIcon field="displayOrder" /></th>
        <th style="width: 11rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-partner>
      <tr>
        <td>{{ partner.pkid }}</td>
        <td>{{ partner.name }}</td>
        <td>{{ partner.appKey }}</td>
        <td>{{ partner.nameOnPartnerMenu }}</td>
        <td>{{ partner.displayOrder }}</td>
        <td>
          <div class="row-actions">
            <p-button icon="pi pi-eye" severity="secondary" [text]="true" pTooltip="檢視" (onClick)="view(partner)" />
            <p-button icon="pi pi-pencil" severity="info" [text]="true" pTooltip="編輯" (onClick)="edit(partner)" />
            <p-button icon="pi pi-trash" severity="danger" [text]="true" pTooltip="刪除" (onClick)="confirmDelete(partner)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="empty">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="filter-field">
      <label for="f-keyword">關鍵字</label>
      <input
        id="f-keyword"
        type="text"
        pInputText
        [(ngModel)]="filter.keyword"
        placeholder="廠商名稱／應用金鑰／顯示名稱"
      />
    </div>
  </div>

  <ng-template #footer>
    <div class="filter-footer">
      <p-button label="清除" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="clearFilter()" />
      <p-button label="套用" icon="pi pi-check" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
