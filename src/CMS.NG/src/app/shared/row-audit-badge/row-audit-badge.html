<button type="button" class="row-audit-badge" (click)="openDialog()">
  <i class="pi pi-history"></i>
  <span class="badge-label">異動紀錄 History</span>
  @if (loading()) {
    <span class="badge-latest muted">載入中…</span>
  } @else if (latest(); as l) {
    <span class="badge-latest">
      {{ l.actionType }} by {{ l.userName }} · {{ l.dateTime | date: 'yyyy-MM-dd HH:mm' }}
    </span>
  } @else {
    <span class="badge-latest muted">尚無異動紀錄 no history</span>
  }
</button>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [style]="{ width: '44rem' }"
  header="異動紀錄 History"
>
  @if (loading()) {
    <p class="audit-empty">載入中…</p>
  } @else if (hasHistory()) {
    <table class="audit-table">
      <thead>
        <tr>
          <th class="col-time">時間 DateTime</th>
          <th class="col-user">使用者 User</th>
          <th class="col-action">動作 Action</th>
          <th class="col-desc">說明 Description</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of entries(); track $index) {
          <tr>
            <td class="col-time">{{ entry.dateTime | date: 'yyyy-MM-dd HH:mm:ss' }}</td>
            <td class="col-user">{{ entry.userName }}</td>
            <td class="col-action">
              <p-tag [value]="entry.actionType" [severity]="actionSeverity(entry.actionType)" />
            </td>
            <td class="col-desc">{{ entry.actionDesc || '—' }}</td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="audit-empty">尚無異動紀錄 no history yet</p>
  }
</p-dialog>
